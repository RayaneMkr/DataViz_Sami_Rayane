services:
  postgres:
    image: postgres:16-alpine
    container_name: dataviz-postgres
    environment:
      POSTGRES_DB: flights
      POSTGRES_USER: dataviz
      POSTGRES_PASSWORD: dataviz123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataviz -d flights"]
      interval: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: dataviz-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    container_name: dataviz-streamlit
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: flights
      DB_USER: dataviz
      DB_PASSWORD: dataviz123

volumes:
  pgdata:
  minio-data:
